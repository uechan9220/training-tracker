<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>トレーニング記録</title>
<meta name="theme-color" content="#14161a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="トレ記録">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <h1>トレーニング記録</h1>
  <div class="today-date" id="headerDate"></div>
</header>

<main id="app">

  <!-- 今日 -->
  <section class="tab-panel" id="panel-today" data-panel="today">
    <div id="todaySummary" class="card summary-card"></div>
    <div id="todayPlan"></div>
    <div id="todayWeight" class="card"></div>
    <div id="todayMeals" class="card"></div>
  </section>

  <!-- プラン -->
  <section class="tab-panel" id="panel-plan" data-panel="plan" hidden>
    <div class="panel-toolbar">
      <button id="planEditToggle" class="btn btn-ghost">編集</button>
      <button id="planResetBtn" class="btn btn-ghost btn-danger" hidden>初期メニューに戻す</button>
      <button id="planClearBtn" class="btn btn-ghost btn-danger" hidden>プランを全消去</button>
    </div>
    <div id="planList"></div>
  </section>

  <!-- 記録 -->
  <section class="tab-panel" id="panel-records" data-panel="records" hidden>
    <div class="filter-row" id="recordFilters">
      <button class="chip active" data-filter="all">全部</button>
      <button class="chip" data-filter="workout">トレーニング</button>
      <button class="chip" data-filter="weight">体重</button>
      <button class="chip" data-filter="meal">食事</button>
    </div>
    <div id="recordsList"></div>
  </section>

  <!-- グラフ -->
  <section class="tab-panel" id="panel-graphs" data-panel="graphs" hidden>
    <div class="card">
      <div class="card-title-row">
        <h2>体重推移</h2>
        <select id="weightRange" class="range-select">
          <option value="14">2週間</option>
          <option value="30" selected>1ヶ月</option>
          <option value="90">3ヶ月</option>
          <option value="9999">全期間</option>
        </select>
      </div>
      <div id="weightChart" class="chart-box"></div>
    </div>
    <div class="card">
      <div class="card-title-row">
        <h2>摂取カロリー推移</h2>
        <select id="calorieRange" class="range-select">
          <option value="14" selected>2週間</option>
          <option value="30">1ヶ月</option>
          <option value="90">3ヶ月</option>
        </select>
      </div>
      <div id="calorieChart" class="chart-box"></div>
    </div>
    <div class="card">
      <div class="card-title-row">
        <h2>種目別の重量推移</h2>
        <select id="liftExerciseSelect" class="range-select"></select>
      </div>
      <div id="liftChart" class="chart-box"></div>
    </div>
  </section>

  <!-- 設定 -->
  <section class="tab-panel" id="panel-settings" data-panel="settings" hidden>
    <div class="card">
      <h2>体格・目標</h2>
      <p class="hint">カロリー目標の計算に使います。この端末内にのみ保存され、共有はされません。</p>
      <label>身長 (cm)<input type="number" id="setHeight" inputmode="decimal"></label>
      <label>年齢<input type="number" id="setAge" inputmode="numeric"></label>
      <label>性別
        <select id="setSex">
          <option value="">選択してください</option>
          <option value="male">男性</option>
          <option value="female">女性</option>
        </select>
      </label>
      <label>目標体重 (kg・任意)<input type="number" id="setGoalWeight" inputmode="decimal"></label>
      <label>活動量
        <select id="setActivity">
          <option value="1.2">低い（座り仕事中心）</option>
          <option value="1.375">やや低い（軽い運動あり）</option>
          <option value="1.55">普通（週3-5回運動）</option>
        </select>
      </label>
      <label>減量ペース（1日あたりの赤字kcal）<input type="number" id="setDeficit" inputmode="numeric" value="500"></label>
      <button id="saveSettingsBtn" class="btn btn-primary">保存</button>
      <div id="calorieTargetResult" class="calc-result"></div>
    </div>

    <div class="card">
      <h2>データ管理</h2>
      <p class="hint">記録はこの端末のブラウザ内にのみ保存されます。機種変更やSafariのデータ消去に備えて、定期的にバックアップをおすすめします。</p>
      <button id="exportBtn" class="btn btn-ghost">バックアップを書き出す (JSON)</button>
      <label class="file-btn btn btn-ghost">
        バックアップを読み込む
        <input type="file" id="importInput" accept="application/json" hidden>
      </label>
      <button id="resetAllBtn" class="btn btn-ghost btn-danger">全データを削除</button>
    </div>
  </section>

</main>

<nav class="tab-bar" id="tabBar">
  <button class="tab-btn active" data-tab="today">
    <span class="tab-icon">🏠</span><span>今日</span>
  </button>
  <button class="tab-btn" data-tab="plan">
    <span class="tab-icon">📋</span><span>プラン</span>
  </button>
  <button class="tab-btn" data-tab="records">
    <span class="tab-icon">📝</span><span>記録</span>
  </button>
  <button class="tab-btn" data-tab="graphs">
    <span class="tab-icon">📈</span><span>グラフ</span>
  </button>
  <button class="tab-btn" data-tab="settings">
    <span class="tab-icon">⚙️</span><span>設定</span>
  </button>
</nav>

<div id="toast" class="toast" hidden></div>

<div id="confirmModal" class="modal-overlay" hidden>
  <div class="modal-box">
    <p id="confirmMessage"></p>
    <div class="modal-actions">
      <button id="confirmCancelBtn" class="btn btn-ghost">キャンセル</button>
      <button id="confirmOkBtn" class="btn btn-primary">OK</button>
    </div>
  </div>
</div>

<script src="plan-data.js"></script>
<script src="exercise-catalog.js"></script>
<script src="meal-presets.js"></script>
<script src="charts.js"></script>
<script src="app.js"></script>
</body>
</html>
